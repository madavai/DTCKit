<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--page-->
<title>DTC Chargeback</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="cb-style">
/* Layout: the portal header, a row of filters, six KPI tiles, then panels on a 12-column grid (trend and movers,
   a CoE-by-month heatmap, ranked lists). Every bar and name narrows the page. Shares its theme with the front page. */
:root{
  --acc:#3DCD58;--acc-weak:rgba(61,205,88,.14);--acc-line:rgba(61,205,88,.6);--acc-ink:rgb(22,128,46);--on-acc:#ffffff;
  --bg:#ffffff;--panel:#fbfbfa;--panel-2:#f1f1ee;--line:rgba(62,55,42,.14);--line-firm:rgba(62,55,42,.24);
  --tx:rgb(38,34,26);--tx1:rgb(66,61,51);--tx2:rgb(109,102,90);
  --s2:rgb(42,120,214);--s2-weak:rgba(42,120,214,.12);--warn:rgb(176,112,0);--warn-weak:rgba(214,150,20,.14);
  --dtc-title:#008F00;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 6px 16px -10px rgba(40,30,10,.25);
  --shadow-hover:0 2px 3px rgba(62,55,42,.06),0 14px 24px -12px rgba(62,55,42,.32);
  --glow:0 4px 18px rgba(61,205,88,.28);--ease:cubic-bezier(.33,.02,.2,1);--radius:14px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c;--panel:#151517;--panel-2:#1c1c1f;--line:rgba(233,228,220,.12);--line-firm:rgba(233,228,220,.2);
  --tx:rgb(242,240,236);--tx1:rgb(216,210,199);--tx2:rgb(163,158,150);--acc-ink:#3DCD58;
  --s2:rgb(57,135,229);--s2-weak:rgba(57,135,229,.16);--warn:rgb(240,180,60);--warn-weak:rgba(240,180,60,.14);--dtc-title:#B1EBBC;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 24px -14px rgba(0,0,0,.9);
  --shadow-hover:inset 0 1px 0 rgba(255,255,255,.04),0 16px 26px -12px rgba(0,0,0,.85);--glow:0 4px 18px rgba(61,205,88,.34);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c;--panel:#151517;--panel-2:#1c1c1f;--line:rgba(233,228,220,.12);--line-firm:rgba(233,228,220,.2);
  --tx:rgb(242,240,236);--tx1:rgb(216,210,199);--tx2:rgb(163,158,150);--acc-ink:#3DCD58;
  --s2:rgb(57,135,229);--s2-weak:rgba(57,135,229,.16);--warn:rgb(240,180,60);--warn-weak:rgba(240,180,60,.14);--dtc-title:#B1EBBC;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 24px -14px rgba(0,0,0,.9);
  --shadow-hover:inset 0 1px 0 rgba(255,255,255,.04),0 16px 26px -12px rgba(0,0,0,.85);--glow:0 4px 18px rgba(61,205,88,.34);
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--font);transition:background .35s,color .35s}
.wrap{max-width:1320px;margin:0 auto;padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--s2);outline-offset:3px;border-radius:6px}
.muted{color:var(--tx2)}
.num{font-variant-numeric:tabular-nums}

/* header: emblem, name, where you are, actions */
.brand{display:flex;align-items:center;gap:14px 18px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.lockup{display:flex;align-items:center;gap:12px;text-decoration:none;flex:none}
.mark-box{width:92px;height:92px;flex:none;transition:width .3s var(--ease),height .3s var(--ease)}
.inner .mark-box{width:60px;height:60px}
.dtc-mark{display:block;width:100%;height:100%}
.dtc-mark .spin{transform-box:view-box;transform-origin:0 0;animation:5s cubic-bezier(.455,.03,.515,.955) infinite alternate}
.dtc-mark .ring-outer{animation-name:dtc-rot-90n}
.dtc-mark .ring-3{animation-name:dtc-rot-360}
.dtc-mark .ring-2{animation-name:dtc-rot-360n}
.dtc-mark .ring-1,.dtc-mark .ring-green{animation-name:dtc-rot-180}
.dtc-mark .cities{transform-box:view-box;transform-origin:0 0;animation:dtc-rot-360 40s linear infinite}
.dtc-mark text{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-weight:700}
@keyframes dtc-rot-90n{to{transform:rotate(-90deg)}}
@keyframes dtc-rot-180{to{transform:rotate(180deg)}}
@keyframes dtc-rot-360{to{transform:rotate(360deg)}}
@keyframes dtc-rot-360n{to{transform:rotate(-360deg)}}
.name{color:var(--acc-ink);font-weight:600;font-size:13px;line-height:1.2}
.name span{display:block}
.divider{align-self:stretch;width:1px;background:var(--line);flex:none}
.titles{flex:1 1 240px;min-width:0}
h1{margin:0;font-size:clamp(20px,2.2vw,28px);font-weight:650;letter-spacing:-.015em;text-wrap:balance}
h1 .acc{color:var(--acc-ink)}
.sub{font-size:12.5px;color:var(--tx2)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font:inherit;border:1px solid var(--line-firm);background:var(--panel);border-radius:999px;height:34px;padding:0 14px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;color:var(--tx1);box-shadow:var(--shadow);text-decoration:none;
  transition:transform .14s var(--ease),box-shadow .22s var(--ease),border-color .14s,color .14s}
.btn:hover{border-color:var(--acc-line);color:var(--acc-ink);transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.note{border:1px dashed var(--line-firm);border-radius:10px;padding:8px 12px;color:var(--tx2);font-size:12.5px;margin-bottom:20px}
.lead{font-size:clamp(16px,1.5vw,19px);color:var(--tx1);max-width:68ch;margin:0 0 22px;text-wrap:pretty}

/* the five doors */
.doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.door{grid-column:span 2;display:flex;flex-direction:column;gap:12px;min-width:0;text-decoration:none;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px 16px;
  transition:transform .16s var(--ease),box-shadow .24s var(--ease),border-color .16s}
.door.wide{grid-column:span 3}
.door:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--acc-line)}
.door:hover .go{color:var(--acc-ink)}.door:hover .go .icon{transform:translateX(4px)}
.door-head{display:flex;align-items:center;gap:10px}
.badge{width:36px;height:36px;border-radius:10px;background:var(--acc-weak);color:var(--acc-ink);display:grid;place-items:center;flex:none}
.door h2{margin:0;font-size:18px;font-weight:650;letter-spacing:-.01em;flex:1;min-width:0}
.ask{color:var(--tx2);margin:0;font-size:13.5px}
.figure{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.figure b{font-size:clamp(30px,3.2vw,42px);font-weight:650;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.figure span{color:var(--tx2);font-size:13px}
.door-body{display:grid;gap:12px;flex:1;align-content:start}
.go{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--tx1);border-top:1px solid var(--line);padding-top:12px;transition:color .14s}
.go .icon{transition:transform .2s var(--ease)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;flex:none}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live{background:var(--acc-weak);color:var(--acc-ink)}
.pill.ready{background:var(--s2-weak);color:var(--s2)}
.pill.need{background:var(--warn-weak);color:var(--warn)}
.pill.need::before{border-radius:1px;transform:rotate(45deg)}
.facts{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.facts li{border:1px solid var(--line-firm);border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--tx1);background:var(--bg)}
.facts b{font-weight:650;color:var(--tx)}
.faces{display:flex;align-items:center}
.faces img,.faces .more{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 2px var(--panel);margin-left:-8px;object-fit:cover;background:var(--panel-2)}
.faces img:first-child{margin-left:0}
.faces .more{display:grid;place-items:center;font-size:12px;font-weight:650;color:var(--tx2)}
.todo{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.todo li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line-firm);padding:3px 0;color:var(--tx1);font-size:13px}
.todo li span:last-child{color:var(--tx2)}

/* charts: thin bars, rounded data ends, values in text ink */
.cols{display:flex;align-items:flex-end;gap:4px;height:var(--h,72px)}
.col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;position:relative}
.col .bar{width:min(100%,26px);border-radius:4px 4px 0 0;background:var(--acc);opacity:.55;min-height:2px}
.col .bar.b2{background:var(--s2);border-radius:0}
.col .bar.top{border-radius:4px 4px 0 0}.col .bar.base{border-radius:0}
.col.last .bar,.cols.full .col .bar{opacity:1}
.col .v{font-size:11px;color:var(--tx1);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2}
.col:hover .bar,.col:focus-visible .bar{opacity:1}
.axis{display:flex;gap:4px;border-top:1px solid var(--line-firm);padding-top:3px;margin-top:0}
.axis span{flex:1;min-width:0;text-align:center;font-size:11px;color:var(--tx2);white-space:nowrap;overflow:hidden}
.rows{display:grid;gap:7px}
.row{display:grid;grid-template-columns:minmax(0,var(--lab,42%)) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.row .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx1)}
.row .track{height:8px;border-radius:0 4px 4px 0;background:transparent;border-left:1px solid var(--line-firm)}
.row .track i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--acc);min-width:2px}
.row .val{font-variant-numeric:tabular-nums;color:var(--tx);font-weight:600;min-width:52px;text-align:right}
.split{display:flex;gap:2px;height:10px}
.split i{display:block;height:100%;background:var(--acc);border-radius:4px 0 0 4px;min-width:3px}
.split i+i{background:var(--s2);border-radius:0 4px 4px 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--tx1)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--acc);display:inline-block}
.legend i.b2{background:var(--s2)}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--panel);border:1px solid var(--line-firm);border-radius:10px;padding:7px 10px;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.6);font-size:12.5px;max-width:260px}
.tip b{display:block;font-weight:650}
.foot{margin-top:22px;font-size:12px;color:var(--tx2);max-width:90ch}

/* second level */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--tx2);font-weight:600;margin-bottom:14px}
.back:hover{color:var(--acc-ink)}
.sec-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.sec-head h2{margin:0;font-size:clamp(22px,2.4vw,30px);font-weight:650;letter-spacing:-.02em}
.sec-ask{font-size:16px;color:var(--tx1);margin:0 0 20px;max-width:70ch}
h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);font-weight:650;margin:26px 0 10px}
.inside{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.item{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--panel);text-decoration:none;min-width:0}
a.item{box-shadow:var(--shadow);transition:transform .16s var(--ease),box-shadow .24s var(--ease),border-color .16s}
a.item:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--acc-line)}
.item.wait{border-style:dashed;background:transparent}
.item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item b{font-size:15px;font-weight:650}
.item p{margin:0;color:var(--tx2);font-size:13px}
.item .open{color:var(--acc-ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;margin-top:2px}
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);padding:16px 18px;min-width:0;display:grid;gap:12px;align-content:start}
.panel h4{margin:0;font-size:15px;font-weight:650}
.panel .cap{margin:-8px 0 0;color:var(--tx2);font-size:12.5px}
.dl{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.dl li{border:1px solid var(--line-firm);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--tx1);display:flex;align-items:center;gap:8px}
/* ---- chargeback overview: filters, KPI tiles, trend, movers, heatmap, ranked lists ---- */
:root{--s3:rgb(235,104,52);--s4:rgb(74,58,167);--c5:rgb(150,144,132)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s3:rgb(217,89,38);--s4:rgb(144,133,233);--c5:rgb(120,116,108)}}
:root[data-theme="dark"]{--s3:rgb(217,89,38);--s4:rgb(144,133,233);--c5:rgb(120,116,108)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 8px}
.filters label{display:grid;gap:2px;font-size:11px;color:var(--tx2);flex:1 1 150px;min-width:0}
select{font:inherit;height:34px;border:1px solid var(--line-firm);border-radius:10px;background:var(--panel);color:var(--tx);padding:0 8px;min-width:0;width:100%}
select.on{border-color:var(--acc);background:var(--acc-weak)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;margin-bottom:12px;align-items:center;font-size:12.5px;color:var(--tx2)}
.chipx{border:1px solid var(--acc-line);background:var(--acc-weak);color:var(--tx);border-radius:999px;padding:3px 10px;font:inherit;font-size:12.5px;cursor:pointer}
.chipx.clear{border-color:var(--line-firm);background:transparent;color:var(--tx2)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:16px}
.tile{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.tile .k{font-size:12px;color:var(--tx2);font-weight:600}
.tile .v{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.25;font-variant-numeric:tabular-nums}
.tile .d{font-size:12.5px;color:var(--tx1)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.grid>.panel{grid-column:span 12}
@media (min-width:1000px){.grid>.w7{grid-column:span 7}.grid>.w5{grid-column:span 5}.grid>.w6{grid-column:span 6}.grid>.w4{grid-column:span 4}}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.panel-head>div:first-child{display:grid;gap:2px;min-width:0}
.panel-head .cap{margin:0}
.seg{display:inline-flex;border:1px solid var(--line-firm);border-radius:10px;overflow:hidden;flex:none}
.seg button{font:inherit;font-size:12.5px;border:0;background:transparent;height:30px;padding:0 10px;cursor:pointer;color:var(--tx2)}
.seg button.on{background:var(--acc-weak);color:var(--tx);font-weight:600}
.col .sg{width:min(100%,34px);min-height:2px;background:var(--c)}
.col .sg+.sg{margin-top:2px}
.col .sg:first-of-type{border-radius:4px 4px 0 0}
.col{cursor:default}
.legend i{background:var(--c,var(--acc))}
.mv{display:grid;grid-template-columns:minmax(0,36%) minmax(0,1fr) 76px;gap:10px;align-items:center;font-size:13px;width:100%;
  background:none;border:0;color:inherit;font:inherit;text-align:left;padding:3px 4px;border-radius:6px;cursor:pointer}
.mv:hover,.rk:hover{background:var(--acc-weak)}
.mv .lab,.rk .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx1)}
.mv .ax{position:relative;height:10px}
.mv .ax::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:1px;background:var(--line-firm)}
.mv .ax i{position:absolute;top:0;height:100%;min-width:2px}
.mv .ax i.up{left:50%;background:var(--s2);border-radius:0 4px 4px 0}
.mv .ax i.dn{right:50%;background:var(--s3);border-radius:4px 0 0 4px}
.mv .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rk{display:grid;grid-template-columns:minmax(0,40%) minmax(0,1fr) 64px 42px;gap:10px;align-items:center;font-size:13px;width:100%;
  background:none;border:0;color:inherit;font:inherit;text-align:left;padding:3px 4px;border-radius:6px;cursor:pointer}
.rk.on{outline:1.5px solid var(--acc);background:var(--acc-weak)}
.rk .track{height:8px;border-left:1px solid var(--line-firm)}
.rk .track i{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--acc);min-width:2px}
.rk .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.rk .pct{text-align:right;font-variant-numeric:tabular-nums;color:var(--tx2);font-size:12px}
.rk[disabled]{cursor:default}.rk[disabled]:hover{background:none}
.list{display:grid;gap:2px}
.heat-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:2px;width:100%;font-size:12.5px;min-width:560px}
.heat th{font-weight:500;color:var(--tx2);font-size:11px;text-align:center;padding:0 2px}
.heat th.rowh{text-align:left;font-size:13px;color:var(--tx1);white-space:nowrap;max-width:230px;overflow:hidden;text-overflow:ellipsis;padding-right:8px}
.heat th.rowh button{font:inherit;color:inherit;background:none;border:0;padding:2px 4px;border-radius:6px;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.heat th.rowh button:hover{background:var(--acc-weak)}
.heat td{height:26px;min-width:34px;border-radius:4px;background:color-mix(in srgb,var(--acc) calc(var(--v)*1%),var(--panel-2))}
.heat td.tot{background:none;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;padding-left:8px;white-space:nowrap}
.scale{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx2)}
.scale i{display:block;width:120px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--panel-2),var(--acc))}
.detail{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);
  padding:16px 18px;margin-top:16px;text-decoration:none}
a.detail{transition:transform .16s var(--ease),box-shadow .24s var(--ease),border-color .16s}
a.detail:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:var(--acc-line)}
.detail b{font-size:15px}.detail p{margin:0;color:var(--tx2);font-size:13px}
.detail>div{flex:1 1 300px;min-width:0}
.empty{border:1px dashed var(--line-firm);border-radius:var(--radius);padding:28px;text-align:center;color:var(--tx2)}
@media (max-width:1000px){.door,.door.wide{grid-column:span 3}}
@media (max-width:640px){.door,.door.wide{grid-column:1/-1}.mark-box{width:64px;height:64px}.divider{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
<!--/page-->
</head>
<body>

 -730.7 -443.8 -767.8 -78.9L-770.5 -25.8L-819.2 -25.8L-816.3 -83.9C-776.9 -471.8 -467.3 -779.8 -78.7 -816.8ZM25.8 -819.3L78.7 -816.8C467.3 -779.8 776.9 -471.8 816.3 -83.9L819.2 -25.8L770.5 -25.8L767.8 -78.9C730.7 -443.8 439.6 -733.5 74 -768.3L25.8 -770.6Z\"/>\u003cpath class=\"spin ring-green\" fill=\"url(#dtc-green)\" fill-rule=\"evenodd\" filter=\"url(#dtc-shadow)\" d=\"M0 -406.8C-224.7 -406.8 -406.8 -224.7 -406.8 0C-406.8 224.7 -224.7 406.8 0 406.8C224.7 406.8 406.8 224.7 406.8 0C406.8 -224.7 224.7 -406.8 0 -406.8ZM0 -712.8C393.7 -712.8 712.8 -393.7 712.8 0C712.8 393.7 393.7 712.8 0 712.8C-393.7 712.8 -712.8 393.7 -712.8 0C-712.8 -393.7 -393.7 -712.8 0 -712.8Z\"/>\u003cg class=\"cities\">\u003cg fill=\"#1B5A2A\" fill-opacity=\".8\">\u003crect x=\"-7.3\" y=\"-614\" width=\"14.7\" height=\"110\" rx=\"7.3\"/>\u003crect x=\"-7.3\" y=\"504\" width=\"14.7\" height=\"110\" rx=\"7.3\"/>\u003crect x=\"-614\" y=\"-7.3\" width=\"110\" height=\"14.7\" rx=\"7.3\"/>\u003crect x=\"504\" y=\"-7.3\" width=\"110\" height=\"14.7\" rx=\"7.3\"/>\u003c/g>\u003ctext fill=\"#1B5A2A\" font-size=\"92\" letter-spacing=\"7\" text-anchor=\"middle\">\u003ctextPath href=\"#dtc-city-path\" startOffset=\"410\">MONTERREY\u003c/textPath>\u003ctextPath href=\"#dtc-city-path\" startOffset=\"1230\">NASHVILLE\u003c/textPath>\u003ctextPath href=\"#dtc-city-path\" startOffset=\"2050\">BARCELONA\u003c/textPath>\u003ctextPath href=\"#dtc-city-path\" startOffset=\"2870\">BANGALORE\u003c/textPath>\u003c/text>\u003c/g>\u003cg>\u003ctext fill=\"var(--dtc-title, #008F00)\" font-size=\"140\" text-anchor=\"middle\" dominant-baseline=\"central\" filter=\"url(#dtc-text-shadow)\">\u003ctspan x=\"0\" y=\"-168\">Digital\u003c/tspan>\u003ctspan x=\"0\" y=\"0\">Technology\u003c/tspan>\u003ctspan x=\"0\" y=\"168\">Centres\u003c/tspan>\u003c/text>\u003c/g>\u003c/svg>","links":{"index":"index.html","detail":"chargeback-detail.html"}}</script>
<script id="cb-app">
(function () {
  var D = JSON.parse(document.getElementById("cb-data").textContent);
  var app = document.getElementById("app");
  if (!D.rows) { app.textContent = "No data yet. Load a chargeback export with: python3 -m engine ingest chargeback <file>  then run: python3 -m engine build"; return; }
  var HOSTED = !!(window.claude && window.claude.use), downloads = null;
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var C = {}; D.cols.forEach(function (n, i) { C[n] = i; });
  var DIMS = [
    { key: "fn", label: "Function", all: "All functions" },
    { key: "type", label: "Type", all: "All types" },
    { key: "coe", label: "CoE", all: "All CoEs" },
    { key: "place", label: "Location", all: "All locations" },
    { key: "cc", label: "Cost centre", all: "All cost centres" },
    { key: "project", label: "Project", all: "All projects" }
  ];
  var F = {};                       // dimension key -> chosen index
  var split = "type", moverBy = "project";

  // ---- small helpers
  function h(tag, attrs, kids) {
    var e = document.createElement(tag), k;
    for (k in attrs || {}) {
      if (k === "cls") e.className = attrs[k];
      else if (k === "text") e.textContent = attrs[k];
      else if (k === "style") e.style.cssText = attrs[k];
      else e.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return e;
  }
  function icon(paths) {
    var s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("viewBox", "0 0 24 24"); s.setAttribute("class", "icon"); s.setAttribute("aria-hidden", "true");
    paths.forEach(function (d) { var p = document.createElementNS("http://www.w3.org/2000/svg", "path"); p.setAttribute("d", d); s.appendChild(p); });
    return s;
  }
  var ARROW = ["M5 12h14", "M13 6l6 6-6 6"], BACK = ["M19 12H5", "M11 6l-6 6 6 6"], DOWN = ["M12 4v11", "M7 10l5 5 5-5", "M5 20h14"];
  var CUR = D.source.currency === "EUR" ? "€" : (D.source.currency || "") + " ";
  function money(v) {
    var a = Math.abs(v), s = v < 0 ? "-" : "";
    if (a >= 1e6) return s + CUR + (a / 1e6).toFixed(a >= 1e7 ? 1 : 2) + "M";
    if (a >= 1e3) return s + CUR + Math.round(a / 1e3) + "k";
    return s + CUR + Math.round(a);
  }
  function full(v) { return (v < 0 ? "-" : "") + CUR + String(Math.round(Math.abs(v))).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
  function signed(v) { return (v >= 0 ? "+" : "-") + money(Math.abs(v)); }
  function pct(v) { return (Math.abs(v) < 10 ? v.toFixed(1) : Math.round(v)) + "%"; }
  function mon(m) { return MONTHS[+m.slice(5) - 1]; }
  function monYear(m) { return mon(m) + " " + m.slice(0, 4); }
  var RANGE = mon(D.months[0]) + " to " + monYear(D.months[D.months.length - 1]);

  // ---- one floating tooltip for every mark
  var tip = h("div", { cls: "tip", hidden: "" }); document.body.appendChild(tip);
  function tipOn(el, title, lines) {
    if (!el.hasAttribute("tabindex") && el.tagName !== "BUTTON") el.setAttribute("tabindex", "0");
    el.setAttribute("aria-label", title + ": " + lines.join(", "));
    function show() {
      tip.textContent = ""; tip.appendChild(h("b", { text: title }));
      lines.forEach(function (l) { tip.appendChild(h("div", { text: l })); });
      tip.hidden = false;
      var r = el.getBoundingClientRect(), w = tip.offsetWidth;
      tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2)) + "px";
      tip.style.top = Math.max(8, r.top - tip.offsetHeight - 8) + "px";
    }
    function hide() { tip.hidden = true; }
    el.addEventListener("pointerenter", show); el.addEventListener("pointerleave", hide);
    el.addEventListener("focus", show); el.addEventListener("blur", hide);
  }

  // ---- data
  function rowsNow() {
    var keys = Object.keys(F);
    return D.rows.filter(function (r) { for (var i = 0; i < keys.length; i++) if (r[C[keys[i]]] !== F[keys[i]]) return false; return true; });
  }
  function sumBy(rows, col, field) {
    var out = {}, f = C[field || "amount"];
    rows.forEach(function (r) { out[r[col]] = (out[r[col]] || 0) + r[f]; });
    return out;
  }
  function ranked(obj) { return Object.keys(obj).map(function (k) { return [k, obj[k]]; }).sort(function (a, b) { return b[1] - a[1]; }); }
  function name(dim, ix) { return D.dims[dim][ix]; }
  // A colour belongs to a member, not to its rank today: the four largest over the whole file keep their colour under any filter.
  var SERIES = ["var(--acc)", "var(--s2)", "var(--s3)", "var(--s4)"], REST = "var(--c5)";
  var COLOUR = {};
  ["type", "fn", "place"].forEach(function (dim) {
    COLOUR[dim] = {};
    ranked(sumBy(D.rows, C[dim])).slice(0, 4).forEach(function (x, i) { COLOUR[dim][x[0]] = SERIES[i]; });
  });

  function setFilter(dim, ix) {
    if (ix == null || F[dim] === ix) delete F[dim]; else F[dim] = ix;
    render();
  }

  // ---- header and filters
  function header() {
    var markBox = h("span", { cls: "mark-box" }); markBox.innerHTML = D.mark;     // the emblem ships inside this file's own data block
    var nm = h("span", { cls: "name" }, (D.source.org || "Digital Technology Centers").split(" ").map(function (w) { return h("span", { text: w }); }));
    var csv = h("button", { cls: "btn", type: "button" }, [icon(DOWN), "Download data (CSV)"]);
    csv.addEventListener("click", saveCsv);
    var save = h("button", { cls: "btn", type: "button" }, [icon(DOWN), "Download HTML"]);
    save.addEventListener("click", saveFile);
    csv.hidden = save.hidden = HOSTED && !downloads;
    var theme = h("button", { cls: "btn", type: "button" }, ["Switch theme"]);
    theme.addEventListener("click", function () {
      var root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      root.dataset.theme = dark ? "light" : "dark";
      try { localStorage.setItem("portal-theme", root.dataset.theme); } catch (e) {}
    });
    return h("header", { cls: "brand inner" }, [h("a", link({ cls: "lockup", "aria-label": "Portal home" }, D.links.index), [markBox, nm]),
      h("span", { cls: "divider", "aria-hidden": "true" }),
      h("div", { cls: "titles" }, [h("h1", {}, ["Portal · ", h("span", { cls: "acc", text: "Chargeback" })]),
        h("div", { cls: "sub", text: D.source.name + " · " + RANGE + " · prepared " + (D.source.generated || "") })]),
      h("div", { cls: "actions" }, [csv, save, theme])]);
  }
  function link(attrs, href) {
    attrs.href = href;
    if (/^https?:/.test(href)) { attrs.target = "_blank"; attrs.rel = "noopener"; }
    return attrs;
  }
  function filters() {
    var box = h("div", { cls: "filters" });
    DIMS.forEach(function (d) {
      var totals = sumBy(D.rows, C[d.key]);
      var sel = h("select", { id: "f-" + d.key, cls: F[d.key] != null ? "on" : "" }, [h("option", { value: "", text: d.all })]);
      ranked(totals).forEach(function (x) {
        var o = h("option", { value: x[0], text: name(d.key, x[0]) });
        if (F[d.key] === +x[0]) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { if (sel.value === "") delete F[d.key]; else F[d.key] = +sel.value; render(); });
      box.appendChild(h("label", {}, [d.label, sel]));
    });
    return box;
  }
  function chips() {
    var box = h("div", { cls: "chips" }), keys = Object.keys(F);
    if (!keys.length) { box.appendChild(h("span", { text: "Showing everything. Pick a filter above, or click any bar or name below to narrow the page." })); return box; }
    keys.forEach(function (k) {
      var d = DIMS.filter(function (x) { return x.key === k; })[0];
      var b = h("button", { cls: "chipx", type: "button", text: d.label + ": " + name(k, F[k]) + "  ✕", "aria-label": "Remove filter " + d.label });
      b.addEventListener("click", function () { setFilter(k, null); });
      box.appendChild(b);
    });
    var c = h("button", { cls: "chipx clear", type: "button", text: "Clear all" });
    c.addEventListener("click", function () { F = {}; render(); });
    box.appendChild(c);
    return box;
  }

  // ---- panels
  function panel(cls, title, cap, body, control) {
    return h("section", { cls: "panel " + cls }, [h("div", { cls: "panel-head" }, [h("div", {}, [h("h4", { text: title }), h("p", { cls: "cap", text: cap })]), control || null]), body]);
  }
  function seg(options, current, onPick) {
    var box = h("div", { cls: "seg", role: "group" });
    options.forEach(function (o) {
      var b = h("button", { type: "button", cls: o[0] === current ? "on" : "", text: o[1], "aria-pressed": o[0] === current ? "true" : "false" });
      b.addEventListener("click", function () { onPick(o[0]); });
      box.appendChild(b);
    });
    return box;
  }
  function tile(k, v, d) { return h("div", { cls: "tile" }, [h("div", { cls: "k", text: k }), h("div", { cls: "v", text: v }), h("div", { cls: "d", text: d || " " })]); }

  function tiles(rows, byMonth) {
    var total = rows.reduce(function (a, r) { return a + r[C.amount]; }, 0);
    var active = D.months.filter(function (m) { return byMonth[m]; });
    var last = active[active.length - 1], prev = active[active.length - 2];
    var staff = rows.filter(function (r) { return r[C.hours] > 0; });
    var hours = staff.reduce(function (a, r) { return a + r[C.hours]; }, 0), staffAmt = staff.reduce(function (a, r) { return a + r[C.amount]; }, 0);
    var rate = {};
    ["Internal", "External"].forEach(function (t) {
      var ix = D.dims.type.indexOf(t), rs = staff.filter(function (r) { return r[C.type] === ix; });
      var hh = rs.reduce(function (a, r) { return a + r[C.hours]; }, 0);
      if (hh) rate[t] = rs.reduce(function (a, r) { return a + r[C.amount]; }, 0) / hh;
    });
    var ext = rows.filter(function (r) { return name("type", r[C.type]) === "External"; }).reduce(function (a, r) { return a + r[C.amount]; }, 0);
    var top = ranked(sumBy(rows, C.project))[0];
    var change = prev ? (byMonth[last] / byMonth[prev] - 1) * 100 : null;
    return h("div", { cls: "tiles" }, [
      tile("Charged back", money(total), active.length ? mon(active[0]) + " to " + monYear(last) + " · " + full(total) : ""),
      tile(last ? monYear(last) : "Latest month", last ? money(byMonth[last]) : "–", change == null ? "" : (change >= 0 ? "▲ " : "▼ ") + pct(Math.abs(change)) + (change >= 0 ? " up on " : " down on ") + mon(prev)),
      tile("Average per month", active.length ? money(total / active.length) : "–", active.length + " months with charges"),
      tile("Cost per hour charged", hours ? CUR + (staffAmt / hours).toFixed(1) : "–", Object.keys(rate).map(function (t) { return t + " " + CUR + rate[t].toFixed(1); }).join(" · ")),
      tile("From external staff", total ? pct(ext / total * 100) : "–", money(ext) + " of " + money(total)),
      tile("Largest project's share", top && total ? pct(top[1] / total * 100) : "–", top ? name("project", top[0]) : "")
    ]);
  }

  function trend(rows, byMonth) {
    var months = D.months, members = [], seriesOf = function () { return 0; };
    if (split !== "none") {
      var col = C[split], known = COLOUR[split];
      var present = ranked(sumBy(rows, col)).map(function (x) { return x[0]; });
      var keys = present.filter(function (k) { return known[k]; });
      var hasRest = present.some(function (k) { return !known[k]; });
      seriesOf = function (r) { var i = keys.indexOf(String(r[col])); return i < 0 ? keys.length : i; };
      members = keys.map(function (k) { return { label: name(split, k), c: known[k] }; });
      if (hasRest) members.push({ label: "Others", c: REST });
    } else members = [{ label: "Charged back", c: "var(--acc)" }];
    var grid = months.map(function () { return members.map(function () { return 0; }); });
    rows.forEach(function (r) { grid[months.indexOf(r[C.month])][seriesOf(r)] += r[C.amount]; });
    var totals = months.map(function (m) { return byMonth[m] || 0; }), max = Math.max.apply(null, totals.concat([1])), peak = totals.indexOf(Math.max.apply(null, totals));
    var cols = h("div", { cls: "cols full", style: "--h:210px" });
    months.forEach(function (m, i) {
      var c = h("div", { cls: "col" });
      if (i === 0 || i === months.length - 1 || i === peak) c.appendChild(h("span", { cls: "v", text: money(totals[i]) }));
      for (var s = members.length - 1; s >= 0; s--) {
        var v = grid[i][s]; if (v <= 0) continue;
        c.appendChild(h("div", { cls: "sg", style: "--c:" + members[s].c + ";height:" + (v / max * 84) + "%" }));
      }
      var lines = members.length > 1 ? members.map(function (mm, s) { return mm.label + " " + full(grid[i][s]); }).filter(function (_, s) { return grid[i][s]; }) : [];
      lines.push("Total " + full(totals[i]));
      if (i > 0 && totals[i - 1]) lines.push((totals[i] >= totals[i - 1] ? "▲ " : "▼ ") + pct(Math.abs(totals[i] / totals[i - 1] - 1) * 100) + " on " + mon(months[i - 1]));
      tipOn(c, monYear(m), lines);
      cols.appendChild(c);
    });
    var ax = h("div", { cls: "axis" }); months.forEach(function (m) { ax.appendChild(h("span", { text: mon(m) })); });
    var body = h("div", { style: "display:grid;gap:10px" });
    if (members.length > 1) body.appendChild(h("div", { cls: "legend" }, members.map(function (mm) { return h("span", {}, [h("i", { style: "--c:" + mm.c }), mm.label]); })));
    body.appendChild(h("div", {}, [cols, ax]));
    return panel("w7", "Charged back per month", "Stacked by the split you choose. Hover a month for the figures.", body,
      seg([["none", "Total"], ["type", "Type"], ["fn", "Function"], ["place", "Location"]], split, function (v) { split = v; render(); }));
  }

  function movers(rows, byMonth) {
    var active = D.months.filter(function (m) { return byMonth[m]; }), last = active[active.length - 1], prev = active[active.length - 2];
    var control = seg([["project", "Project"], ["coe", "CoE"], ["cc", "Cost centre"]], moverBy, function (v) { moverBy = v; render(); });
    if (!prev) return panel("w5", "What moved", "Needs two months to compare.", h("p", { cls: "muted", text: "Only one month in this view." }), control);
    var col = C[moverBy];
    var a = sumBy(rows.filter(function (r) { return r[C.month] === last; }), col), b = sumBy(rows.filter(function (r) { return r[C.month] === prev; }), col);
    var delta = {}; Object.keys(a).concat(Object.keys(b)).forEach(function (k) { delta[k] = (a[k] || 0) - (b[k] || 0); });
    var list = ranked(delta).filter(function (x) { return Math.abs(x[1]) >= 1; });
    var ups = list.filter(function (x) { return x[1] > 0; }).slice(0, 5), downs = list.filter(function (x) { return x[1] < 0; }).slice(-5).reverse();
    var shown = ups.concat(downs.reverse()), max = Math.max.apply(null, shown.map(function (x) { return Math.abs(x[1]); }).concat([1]));
    var box = h("div", { cls: "list" });
    shown.forEach(function (x) {
      var up = x[1] > 0, r = h("button", { cls: "mv", type: "button" }, [h("span", { cls: "lab", text: name(moverBy, x[0]) }),
        h("span", { cls: "ax" }, [h("i", { cls: up ? "up" : "dn", style: "width:" + (Math.abs(x[1]) / max * 50) + "%" })]), h("span", { cls: "val", text: signed(x[1]) })]);
      tipOn(r, name(moverBy, x[0]), [mon(prev) + " " + full(b[x[0]] || 0), mon(last) + " " + full(a[x[0]] || 0), "Change " + signed(x[1])]);
      r.addEventListener("click", function () { setFilter(moverBy, +x[0]); });
      box.appendChild(r);
    });
    if (!shown.length) box.appendChild(h("p", { cls: "muted", text: "Nothing changed between the two months." }));
    var net = (byMonth[last] || 0) - (byMonth[prev] || 0);
    var body = h("div", { style: "display:grid;gap:10px" }, [h("div", { cls: "legend" }, [h("span", {}, [h("i", { style: "--c:var(--s2)" }), "Increase"]), h("span", {}, [h("i", { style: "--c:var(--s3)" }), "Decrease"])]), box]);
    return panel("w5", "What moved in " + monYear(last), "Against " + mon(prev) + ". Net " + signed(net) + ". Largest five each way.", body, control);
  }

  function heat(rows) {
    var totals = ranked(sumBy(rows, C.coe)), top = totals.slice(0, 10), rest = totals.slice(10);
    var cell = {};
    rows.forEach(function (r) { var k = r[C.coe] + "|" + r[C.month]; cell[k] = (cell[k] || 0) + r[C.amount]; });
    var lines = top.map(function (x) { return { label: name("coe", x[0]), ix: +x[0], total: x[1], v: D.months.map(function (m) { return cell[x[0] + "|" + m] || 0; }) }; });
    if (rest.length) lines.push({ label: rest.length + " other CoEs", ix: null, total: rest.reduce(function (a, x) { return a + x[1]; }, 0),
      v: D.months.map(function (m) { return rest.reduce(function (a, x) { return a + (cell[x[0] + "|" + m] || 0); }, 0); }) });
    var max = Math.max.apply(null, lines.map(function (l) { return Math.max.apply(null, l.v); }).concat([1]));
    var t = h("table", { cls: "heat" }), hr = h("tr", {}, [h("th")]);
    D.months.forEach(function (m) { hr.appendChild(h("th", { scope: "col", text: mon(m) })); });
    hr.appendChild(h("th", { scope: "col", text: "Total", style: "text-align:right" }));
    t.appendChild(h("thead", {}, [hr]));
    var tb = h("tbody");
    lines.forEach(function (l) {
      var th = h("th", { cls: "rowh", scope: "row" });
      if (l.ix == null) th.textContent = l.label;
      else { var b = h("button", { type: "button", text: l.label, title: "Show only " + l.label }); b.addEventListener("click", function () { setFilter("coe", l.ix); }); th.appendChild(b); }
      var tr = h("tr", {}, [th]);
      l.v.forEach(function (v, i) {
        var td = h("td", { style: "--v:" + (v > 0 ? Math.max(6, Math.sqrt(v / max) * 100) : 0).toFixed(1) });
        tipOn(td, l.label + ", " + monYear(D.months[i]), [full(v)]);
        tr.appendChild(td);
      });
      tr.appendChild(h("td", { cls: "tot", text: money(l.total) }));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    var body = h("div", { style: "display:grid;gap:10px" }, [h("div", { cls: "heat-wrap" }, [t]), h("div", { cls: "scale" }, ["Less", h("i"), "More (up to " + money(max) + " in a month)"])]);
    return panel("", "Where the cost builds up: CoE by month", "Darker means more charged that month. Click a CoE to show only its figures.", body);
  }

  function rank(cls, title, cap, rows, dim, opts) {
    opts = opts || {};
    var all = ranked(sumBy(rows, C[dim])).filter(function (x) { return !opts.skip || name(dim, x[0]) !== opts.skip; });
    var total = all.reduce(function (a, x) { return a + x[1]; }, 0), n = opts.n || 8;
    var list = all.slice(0, n), rest = all.slice(n), max = Math.max.apply(null, list.map(function (x) { return x[1]; }).concat([1]));
    var box = h("div", { cls: "list" });
    function line(label, v, ix) {
      var r = h("button", { cls: "rk" + (ix != null && F[dim] === ix ? " on" : ""), type: "button" }, [h("span", { cls: "lab", text: label }),
        h("span", { cls: "track" }, [h("i", { style: "width:" + Math.max(0, v / max * 100) + "%" })]), h("span", { cls: "val", text: money(v) }), h("span", { cls: "pct", text: total ? pct(v / total * 100) : "" })]);
      tipOn(r, label, [full(v), total ? pct(v / total * 100) + " of " + money(total) : ""]);
      if (ix == null) r.disabled = true; else r.addEventListener("click", function () { setFilter(dim, ix); });
      box.appendChild(r);
    }
    list.forEach(function (x) { line(name(dim, x[0]), x[1], +x[0]); });
    if (rest.length) line(rest.length + " others", rest.reduce(function (a, x) { return a + x[1]; }, 0), null);
    if (!all.length) box.appendChild(h("p", { cls: "muted", text: opts.none || "Nothing in this view." }));
    return panel(cls, title + (all.length ? " (" + all.length + ")" : ""), cap, box);
  }

  function rates(rows) {
    var staff = rows.filter(function (r) { return r[C.hours] > 0; });
    var amt = sumBy(staff, C.place), hrs = sumBy(staff, C.place, "hours");
    var list = Object.keys(amt).filter(function (k) { return hrs[k] >= 100; }).map(function (k) { return [k, amt[k] / hrs[k], hrs[k]]; }).sort(function (a, b) { return b[1] - a[1]; });
    var max = Math.max.apply(null, list.map(function (x) { return x[1]; }).concat([1]));
    var box = h("div", { cls: "list" });
    list.forEach(function (x) {
      var r = h("button", { cls: "rk" + (F.place === +x[0] ? " on" : ""), type: "button", style: "grid-template-columns:minmax(0,46%) minmax(0,1fr) 64px" }, [h("span", { cls: "lab", text: name("place", x[0]) }),
        h("span", { cls: "track" }, [h("i", { style: "width:" + (x[1] / max * 100) + "%" })]), h("span", { cls: "val", text: CUR + x[1].toFixed(1) })]);
      tipOn(r, name("place", x[0]), [CUR + x[1].toFixed(2) + " per hour", Math.round(x[2]).toLocaleString("en") + " hours charged"]);
      r.addEventListener("click", function () { setFilter("place", +x[0]); });
      box.appendChild(r);
    });
    if (!list.length) box.appendChild(h("p", { cls: "muted", text: "No staff hours in this view." }));
    return panel("w4", "Cost per hour by location", "Amount divided by hours charged, staff only. Locations under 100 hours are left out.", box);
  }

  function render() {
    tip.hidden = true;
    var keep = document.activeElement && document.activeElement.id;
    var rows = rowsNow(), byMonth = sumBy(rows, C.month);
    var kids = [header(), h("a", link({ cls: "back" }, D.links.index), [icon(BACK), "All sections"]), filters(), chips()];
    if (!rows.length) kids.push(h("div", { cls: "empty", text: "Nothing was charged for this combination. Remove a filter to see figures again." }));
    else {
      kids.push(tiles(rows, byMonth));
      kids.push(h("div", { cls: "grid" }, [trend(rows, byMonth), movers(rows, byMonth), heat(rows),
        rank("w6", "Projects", "Largest first. Click one to show only its figures.", rows, "project", { n: 10 }),
        rank("w6", "Cost centres charged", "Who receives the charge.", rows, "cc", { n: 10 }),
        rank("w4", "Locations", "Where the people charging are based.", rows, "place"),
        rank("w4", "External vendors", "External staff spend by supplier.", rows, "vendor", { skip: "Not external", none: "No external spend in this view." }),
        rates(rows)]));
    }
    if (D.links.detail) kids.push(h("a", link({ cls: "detail" }, D.links.detail), [h("span", { cls: "badge" }, [icon(["M4 5h16", "M4 10h16", "M4 15h16", "M4 20h10"])]),
      h("div", {}, [h("b", { text: "Line detail" }), h("p", { text: "Every charge by person and project, with its own filters, the row list and Excel download." })]), h("span", { cls: "open" }, ["Open", icon(ARROW)])]));
    else kids.push(h("div", { cls: "detail" }, [h("span", { cls: "badge" }, [icon(["M4 5h16", "M4 10h16", "M4 15h16", "M4 20h10"])]),
      h("div", {}, [h("b", { text: "Line detail" }), h("p", { text: "The row-by-row page (person and project, Excel download) is kept in the portal's files and is not published on this link." })])]));
    kids.push(h("p", { cls: "foot", text: "Totals only: nobody is named on this page. Figures follow the filters above. Source: " + D.source.name + ", " + (D.source.rowsRead || "") + " lines read." }));
    app.textContent = "";
    app.appendChild(h("div", { cls: "wrap" }, kids));
    if (keep) { var el = document.getElementById(keep); if (el) el.focus(); }
  }

  // ---- downloads
  function offer(filename, data, type) {
    if (downloads) { downloads.save({ filename: filename, data: data }).catch(function () {}); return; }
    var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: type })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  function saveCsv() {
    function q(v) { v = String(v == null ? "" : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
    var head = ["Month", "CoE", "Type", "Location", "Project", "Function", "Cost centre", "Vendor", "Amount (" + D.source.currency + ")", "Hours", "People"];
    var keys = ["coe", "type", "place", "project", "fn", "cc", "vendor"];
    var lines = [head.join(",")].concat(rowsNow().map(function (r) {
      return [r[C.month]].concat(keys.map(function (k) { return q(name(k, r[C[k]])); })).concat([r[C.amount], r[C.hours], r[C.people]]).join(",");
    }));
    offer("dtc-chargeback.csv", "﻿" + lines.join("\r\n"), "text/csv");
  }
  function saveFile() {
    var html = '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<!--page-->\n' +
      '<title>DTC Chargeback</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n<style id="cb-style">' + document.getElementById("cb-style").textContent +
      '</style>\n<!--/page-->\n</head>\n<body>\n<!--page-->\n<div id="app"></div>\n<script type="application/json" id="cb-data">' + JSON.stringify(D).replace(/</g, "\\u003c") +
      '</' + 'script>\n<script id="cb-app">' + document.getElementById("cb-app").textContent + '</' + 'script>\n<!--/page-->\n</body>\n</html>\n';
    offer("dtc-chargeback.html", html, "text/html");
  }
  if (HOSTED) window.claude.use("downloads").then(function (x) { if (x) { downloads = x; render(); } }, function () {});

  try { var saved = localStorage.getItem("portal-theme"); if (saved && !document.documentElement.dataset.theme) document.documentElement.dataset.theme = saved; } catch (e) {}
  render();
})();
</script>
<!--/page-->
</body>
